<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>LUMIÈRE - Grand Luxury Hotel</title>
  
  <!-- Tailwind CSS CDN -->
  <script src="https://cdn.tailwindcss.com"></script>

  <!-- Google Web Fonts -->
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link
    href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@300;400;500&family=Jost:wght@300;400&family=Noto+Serif+KR:wght@200;300;400&display=swap"
    rel="stylesheet"
  />

  <style>
    .font-cormorant {
      font-family: 'Cormorant Garamond', Georgia, serif;
    }
    .font-jost {
      font-family: 'Jost', sans-serif;
    }
    .font-noto {
      font-family: 'Noto Serif KR', serif;
      word-break: keep-all;
    }

    /* 순차 페이드업 애니메이션 */
    @keyframes heroFadeUp {
      from {
        opacity: 0;
        transform: translateY(30px);
      }
      to {
        opacity: 1;
        transform: translateY(0);
      }
    }
    .fade-up {
      opacity: 0;
      animation: heroFadeUp 1.2s cubic-bezier(0.22, 1, 0.36, 1) forwards;
    }
    .delay-1 { animation-delay: 0.2s; }
    .delay-2 { animation-delay: 0.45s; }
    .delay-3 { animation-delay: 0.7s; }
    .delay-4 { animation-delay: 0.95s; }

    /* 스크롤 인디케이터 라인 애니메이션 */
    @keyframes pulseLine {
      0% { transform: translateY(-100%); }
      100% { transform: translateY(100%); }
    }
    .animate-pulse-line {
      animation: pulseLine 2s cubic-bezier(0.65, 0, 0.35, 1) infinite;
    }
  </style>
</head>
<body class="bg-black text-white selection:bg-[#c9a96a]/30 overflow-x-hidden">

  <!-- ================= HERO SECTION ================= -->
  <section class="relative w-full h-screen overflow-hidden bg-black flex items-center justify-center">
    
    <!-- 1. 로컬 비디오 배경 (public 폴더의 /hotel-bg.mp4) -->
    <video
      id="hotelVideo"
      src="/hotel-bg.mp4"
      autoplay
      loop
      muted
      playsinline
      class="absolute top-0 left-0 w-full h-full object-cover z-0"
    ></video>

    <!-- 2. 반투명 다크 오버레이 (시네마틱 그라데이션) -->
    <div class="absolute inset-0 z-10 bg-gradient-to-b from-black/60 via-black/30 to-black/70 pointer-events-none"></div>

    <!-- 3. 컨텐츠 컨테이너 (정중앙 배치) -->
    <div class="relative z-20 flex flex-col items-center justify-center text-center px-6 max-w-4xl mx-auto">
      
      <!-- 서브 슬로건 -->
      <p 
        class="fade-up delay-1 font-jost text-xs md:text-sm font-light tracking-[0.45em] uppercase text-[#e6cf9d] mb-4 md:mb-5 drop-shadow-md"
        style="padding-left: 0.45em;"
      >
        A Symphony of Time and Space
      </p>

      <!-- 호텔 메인 타이틀 -->
      <h1 
        class="fade-up delay-2 font-cormorant text-5xl sm:text-7xl md:text-8xl lg:text-9xl font-light tracking-[0.25em] text-[#f3ead8] drop-shadow-[0_4px_30px_rgba(0,0,0,0.9)] mb-6 md:mb-8 select-none"
        style="padding-left: 0.25em;"
      >
        LUMIÈRE
      </h1>

      <!-- 미니멀 골드 구분선 -->
      <div class="fade-up delay-3 w-16 md:w-24 h-px bg-[#c9a96a]/80 mb-7 md:mb-9"></div>

      <!-- 보조 카피 -->
      <p 
        class="fade-up delay-3 font-noto text-sm md:text-base font-light tracking-[0.2em] text-[#d8d4cb]/90 mb-9 md:mb-11"
        style="padding-left: 0.2em;"
      >
        시간과 공간이 빚어내는 궁극의 휴식
      </p>

      <!-- 예약 버튼 -->
      <div class="fade-up delay-4">
        <a
          href="#reserve"
          class="group relative inline-block overflow-hidden border border-[#c9a96a]/80 px-10 py-3.5 md:px-14 md:py-4 transition-all duration-500 hover:shadow-[0_0_40px_rgba(201,169,106,0.45)] hover:-translate-y-0.5 active:scale-95"
        >
          <!-- 호버 시 골드 그라데이션 차오름 -->
          <span class="absolute inset-0 translate-y-full bg-gradient-to-r from-[#c9a96a] to-[#e6cf9d] transition-transform duration-500 ease-out group-hover:translate-y-0"></span>
          
          <!-- 버튼 텍스트 -->
          <span class="relative z-10 font-jost text-xs md:text-sm tracking-[0.35em] uppercase text-[#f3ead8] transition-colors duration-500 group-hover:text-black" style="padding-left: 0.35em;">
            Reserve Your Stay
          </span>
        </a>
      </div>

    </div>

    <!-- 하단 Scroll Down 인디케이터 -->
    <div class="absolute bottom-8 z-20 flex flex-col items-center gap-2 opacity-60 pointer-events-none">
      <span class="font-jost text-[9px] tracking-[0.3em] uppercase text-[#f3ead8]/70" style="padding-left: 0.3em;">
        Scroll
      </span>
      <div class="w-px h-8 bg-white/20 overflow-hidden relative">
        <div class="w-full h-1/2 bg-[#c9a96a] animate-pulse-line"></div>
      </div>
    </div>

  </section>

  <!-- 브라우저 자동재생 보정 스크립트 -->
  <script>
    document.addEventListener("DOMContentLoaded", function () {
      const video = document.getElementById("hotelVideo");
      if (video) {
        video.muted = true;
        const playPromise = video.play();
        if (playPromise !== undefined) {
          playPromise.catch(function (error) {
            console.warn("자동재생 대기:", error);
          });
        }
      }
    });
  </script>
</body>
</html>
